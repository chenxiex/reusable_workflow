name: Dev Container Build and Push Image

on:
  workflow_call:
    inputs:
      registry:
        description: Container registry to push the image to.
        required: false
        type: string
        default: ghcr.io
      image_name:
        description: Image name without registry. Defaults to "<owner>/<repo>/devcontainer".
        required: false
        type: string
        default: ""
      sub_folder:
        description: Folder that contains the .devcontainer directory.
        required: false
        type: string
        default: .github
      build_variant:
        description: Optional image variant exposed to devcontainer.json as DEVCONTAINER_BUILD_VARIANT.
        required: false
        type: string
        default: ""
      push:
        description: Push behavior passed to devcontainers/ci.
        required: false
        type: string
        default: always
    secrets:
      REGISTRY_USERNAME:
        description: Container registry username. Falls back to github.actor only when registry is ghcr.io.
        required: false
      REGISTRY_PASSWORD:
        description: Container registry password. Falls back to github.token only when registry is ghcr.io.
        required: false

env:
  REGISTRY: ${{ inputs.registry }}
  IMAGE_NAME: ${{ inputs.image_name != '' && inputs.image_name || format('{0}/devcontainer', github.repository) }}
      
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      packages: write

    steps:
    - 
      name: Checkout
      uses: actions/checkout@v4
    -
      name: Login to Container Registry
      uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.REGISTRY_USERNAME != '' && secrets.REGISTRY_USERNAME || (env.REGISTRY == 'ghcr.io' && github.actor || '') }}
        password: ${{ secrets.REGISTRY_PASSWORD != '' && secrets.REGISTRY_PASSWORD || (env.REGISTRY == 'ghcr.io' && github.token || '') }}
    -
      name: Normalize image name
      shell: bash
      run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
    - 
      name: Pre-build dev container image
      uses: devcontainers/ci@v0.3
      env:
        DEVCONTAINER_BUILD_VARIANT: ${{ inputs.build_variant }}
      with:
        subFolder: ${{ inputs.sub_folder }}
        imageName: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        cacheFrom: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        push: ${{ inputs.push }}
